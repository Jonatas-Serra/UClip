name: Trigger Release

# Dispara uma release via UI do GitHub Actions sem precisar rodar bash local.
# Bumpa versão (4 lugares), commita em main, cria tag v<versão> e pusha.
# O release.yml (gatilhado por push de tag) entra em ação automaticamente em seguida
# rodando o CI como gate, buildando .deb + AppImage e publicando a release.
#
# Uso: Actions tab → "Trigger Release" → "Run workflow" → versão (X.Y.Z) → Run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (formato X.Y.Z, sem o "v")'
        required: true
        type: string

permissions:
  contents: write

jobs:
  trigger:
    name: Bump version, tag and push
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Versão inválida: '$VERSION' (esperado X.Y.Z, sem 'v')"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check tag does not already exist
        run: |
          TAG="v${{ inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Tag $TAG já existe. Use outra versão ou delete a tag antes."
            exit 1
          fi
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Tag $TAG já existe no remoto."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bump version files
        run: python3 scripts/bump_version.py "${{ inputs.version }}"

      - name: Clean dev data (idempotent)
        run: bash scripts/clean_dev_data.sh || true

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit, tag and push
        run: |
          TAG="v${{ inputs.version }}"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${{ inputs.version }}"
            git push origin main
          else
            echo "Nada a comitar — arquivos de versão já estão em ${{ inputs.version }}."
          fi
          git tag -a "$TAG" -m "Release ${{ inputs.version }}"
          git push origin "$TAG"

      - name: Summary
        run: |
          V="${{ inputs.version }}"
          {
            echo "## 🚀 Release v${V} disparada"
            echo ""
            echo "- Tag criada: \`v${V}\`"
            echo "- O workflow **Release** (gatilhado por push de tag) vai rodar o CI como gate, buildar .deb + AppImage e publicar a release."
            echo ""
            echo "Acompanhe em: [Actions](https://github.com/${{ github.repository }}/actions)"
            echo "Release final em: [v${V}](https://github.com/${{ github.repository }}/releases/tag/v${V})"
          } >> "$GITHUB_STEP_SUMMARY"
