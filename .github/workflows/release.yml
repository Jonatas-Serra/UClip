name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Gate: testes têm de passar antes de empacotar
  test:
    uses: ./.github/workflows/ci.yml

  build-and-release:
    name: Build and Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para gerar changelog a partir de git log

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Extrai versão e valida bate com package.json (proteção contra esquecer bump)
      - name: Extract & verify version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NUMBER=${VERSION#v}
          PKG_VERSION=$(node -p "require('./frontend/package.json').version")
          if [ "$PKG_VERSION" != "$VERSION_NUMBER" ]; then
            echo "❌ Tag ($VERSION_NUMBER) != package.json ($PKG_VERSION). Use scripts/bump_version.py antes da tag."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NUMBER=${VERSION_NUMBER}" >> $GITHUB_OUTPUT

      - name: Clean development data
        run: bash scripts/clean_dev_data.sh || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxss1 fakeroot dpkg python3 python3-pip python3-venv xclip wl-clipboard

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Prepare app for packaging
        run: cd frontend && npm run prepack

      - name: Build AppImage and DEB
        run: cd frontend && npx electron-builder --linux deb AppImage --publish never
        env:
          SKIP_NOTARIZATION: true

      - name: Rename build artifacts
        run: |
          cd frontend/dist
          V=${{ steps.version.outputs.VERSION_NUMBER }}
          for f in uclip-frontend_*.deb; do [ -f "$f" ] && mv "$f" "UClip-${V}.deb"; done
          for f in uclip-frontend-*.AppImage; do [ -f "$f" ] && mv "$f" "UClip-${V}.AppImage"; done
          ls -lah UClip-*

      - name: Generate SHA256SUMS
        run: |
          cd frontend/dist
          sha256sum UClip-*.deb UClip-*.AppImage > SHA256SUMS
          cat SHA256SUMS

      # Gera changelog a partir dos commits entre a tag anterior e a atual
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges -50)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges "$PREV_TAG"..HEAD)
          fi
          # exporta multi-line para o output do GitHub
          {
            echo "changelog<<EOF_CHANGELOG"
            echo "$LOG"
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: UClip ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            frontend/dist/UClip-*.AppImage
            frontend/dist/UClip-*.deb
            frontend/dist/SHA256SUMS
          body: |
            ## 📦 UClip ${{ steps.version.outputs.VERSION }}

            ### 📥 Instalação rápida (Ubuntu/Debian)

            ```bash
            V=${{ steps.version.outputs.VERSION_NUMBER }}
            wget https://github.com/Jonatas-Serra/UClip/releases/download/${{ steps.version.outputs.VERSION }}/UClip-${V}.deb
            sudo apt install -y ./UClip-${V}.deb
            ```

            Tudo é configurado automaticamente: user services systemd, atalho Super+V via gsettings e diretório de dados em `~/.local/share/uclip`.

            ### 🔐 Checksums (SHA256)
            Veja `SHA256SUMS` nos assets desta release para verificar a integridade dos arquivos.

            ### 📝 Mudanças
            ${{ steps.changelog.outputs.changelog }}

            ### 🛠️ Verificação
            ```bash
            systemctl --user status uclip-backend.service
            systemctl --user status uclip-listener.service
            curl http://127.0.0.1:8001/health
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (debugging)
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.version.outputs.VERSION }}
          path: |
            frontend/dist/*.AppImage
            frontend/dist/*.deb
            frontend/dist/SHA256SUMS
          retention-days: 30
