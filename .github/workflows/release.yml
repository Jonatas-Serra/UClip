name: Release

# Release end-to-end disparada pela UI do GitHub Actions.
# Fluxo:  validate input → checkout main → backend tests → frontend typecheck
#         → bump versão → regenera lockfile → build .deb/AppImage → checksum
#         → SE TUDO OK: commit + push main + tag + push tag → publica GitHub Release
#
# Decisões:
# - Único workflow_dispatch (sem 'push: tags' separado) pra evitar o gotcha
#   do GITHUB_TOKEN, que não dispara workflows derivados.
# - "Lock-in tardio": só commita o bump e cria a tag DEPOIS de o build passar.
#   Se algo quebrar, main fica intacto e a tag não nasce.
# - Lockfile é regenerado em cada release pra evitar drift entre package.json
#   e package-lock.json após o bump.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (formato X.Y.Z, sem o "v")'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Bump, test, build & publish
    runs-on: ubuntu-latest
    steps:
      # ───────────────── Validation ─────────────────
      - name: Validate version format
        run: |
          V="${{ inputs.version }}"
          if ! [[ $V =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Versão inválida: '$V' (esperado X.Y.Z, sem o prefixo 'v')"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure tag does not already exist
        run: |
          TAG="v${{ inputs.version }}"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Tag $TAG já existe. Use outra versão ou apague a tag antes."
            exit 1
          fi

      # ───────────────── Setup ─────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxss1 fakeroot dpkg python3-venv xclip wl-clipboard

      # ───────────────── Test gate ─────────────────
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          export PYTHONPATH="$(pwd)"
          pytest -v backend/tests --tb=short

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      # ───────────────── Bump ─────────────────
      - name: Bump version files
        run: python3 scripts/bump_version.py "${{ inputs.version }}"

      - name: Regenerate package-lock.json after bump
        run: cd frontend && npm install --package-lock-only --no-audit --no-fund

      # ───────────────── Build ─────────────────
      - name: Clean dev data
        run: bash scripts/clean_dev_data.sh || true

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Prepare app for packaging
        run: cd frontend && npm run prepack

      - name: Build .deb + AppImage
        run: cd frontend && npx electron-builder --linux deb AppImage --publish never
        env:
          SKIP_NOTARIZATION: true

      - name: Rename build artifacts
        run: |
          cd frontend/dist
          V="${{ inputs.version }}"
          for f in uclip-frontend_*.deb; do [ -f "$f" ] && mv "$f" "UClip-${V}.deb"; done
          for f in uclip-frontend-*.AppImage; do [ -f "$f" ] && mv "$f" "UClip-${V}.AppImage"; done
          ls -lah UClip-*

      - name: Generate SHA256SUMS
        run: |
          cd frontend/dist
          sha256sum UClip-*.deb UClip-*.AppImage > SHA256SUMS
          cat SHA256SUMS

      # ───────────────── Lock-in: commit + tag + push ─────────────────
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit bump and push main
        run: |
          V="${{ inputs.version }}"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${V}"
            git push origin main
          else
            echo "Nada a comitar — arquivos de versão já estavam em ${V}."
          fi

      - name: Create and push tag
        run: |
          TAG="v${{ inputs.version }}"
          git tag -a "$TAG" -m "Release ${{ inputs.version }}"
          git push origin "$TAG"

      # ───────────────── Changelog ─────────────────
      - name: Generate changelog
        id: changelog
        run: |
          TAG="v${{ inputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges -50)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges "$PREV_TAG".."$TAG")
          fi
          {
            echo "changelog<<EOF_CHANGELOG"
            echo "$LOG"
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"

      # ───────────────── Publish ─────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: UClip v${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            frontend/dist/UClip-*.AppImage
            frontend/dist/UClip-*.deb
            frontend/dist/SHA256SUMS
          body: |
            ## 📦 UClip v${{ inputs.version }}

            ### 📥 Instalação rápida (Ubuntu/Debian)

            ```bash
            V=${{ inputs.version }}
            wget https://github.com/Jonatas-Serra/UClip/releases/download/v${V}/UClip-${V}.deb
            sudo apt install -y ./UClip-${V}.deb
            ```

            Tudo é configurado automaticamente: user services systemd, atalho Super+V via gsettings e diretório de dados em `~/.local/share/uclip`.

            ### 🔐 Checksums (SHA256)
            Veja `SHA256SUMS` nos assets desta release para verificar a integridade dos arquivos.

            ### 📝 Mudanças
            ${{ steps.changelog.outputs.changelog }}

            ### 🛠️ Verificação
            ```bash
            systemctl --user status uclip-backend.service
            systemctl --user status uclip-listener.service
            curl http://127.0.0.1:8001/health
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-v${{ inputs.version }}
          path: |
            frontend/dist/*.AppImage
            frontend/dist/*.deb
            frontend/dist/SHA256SUMS
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          V="${{ inputs.version }}"
          {
            echo "## 🚀 Release v${V}"
            echo ""
            echo "- Tag: \`v${V}\`"
            echo "- Release: [v${V}](https://github.com/${{ github.repository }}/releases/tag/v${V})"
            echo "- Assets: \`UClip-${V}.deb\`, \`UClip-${V}.AppImage\`, \`SHA256SUMS\`"
          } >> "$GITHUB_STEP_SUMMARY"
